# CI for ADC Cookies & Commerce Hub.
# Lint + isolated standalone tests on every push to main and every PR.
# No secrets, no write permissions, no pull_request_target, third-party
# actions pinned to verified commit SHAs (verified 2026-10-19 via the GitHub
# API: actions/checkout v7.0.1, actions/setup-node v7.1.0,
# shivammathur/setup-php 2.40.0).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Setup Node (for node --check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Syntax + static checks (php -l, node --check, phpcs if present)
        run: bash bin/smoke.sh

      - name: Shell syntax (bin scripts)
        run: |
          set -e
          for s in bin/*.sh; do bash -n "$s" && echo "OK   bash -n $s"; done

      - name: Python syntax (release builder)
        run: python3 -m py_compile bin/lib/build_release.py

  version:
    name: Version consistency (SemVer single source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: bin/version.sh check
        run: bash bin/version.sh check

      - name: Release versioning test
        run: php tests/release/version-test.php

  tests:
    name: Standalone tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Analytics unit tests (each in its own PHP process)
        run: |
          set -e
          shopt -s nullglob
          tests=(tests/analytics/*-test.php)
          if [ ${#tests[@]} -eq 0 ]; then echo "FAIL no analytics tests found"; exit 1; fi
          for t in "${tests[@]}"; do
            echo "-- $t"
            php "$t"
          done

      - name: Updater contract test (tests/updater-test.php — required contract file)
        run: |
          if [ ! -f tests/updater-test.php ]; then
            echo "FAIL tests/updater-test.php missing: the GitHub updater contract (README.md / release.yml) requires it."
            echo "     Provided by the updater module workstream; CI stays red until it lands."
            exit 1
          fi
          php tests/updater-test.php

      - name: Release build tests (deterministic zip, allowlist, manifest)
        run: |
          php tests/release/version-test.php
          php tests/release/build-test.php

  node-syntax:
    name: JS syntax (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: node --check all shipped JS
        run: |
          set -e
          find assets -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "OK   node --check assets/**/*.js on Node ${{ matrix.node }}"
